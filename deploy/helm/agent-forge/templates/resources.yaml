apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web
data:
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /api/ {
        proxy_pass http://{{ .Release.Name }}-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      location / { try_files $uri /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: agent-forge-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: agent-forge-api } }
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: AF_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.api.databaseUrlSecret.name }}, key: {{ .Values.api.databaseUrlSecret.key }} } }
            - name: AF_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.sessionSecret.name }}, key: {{ .Values.api.sessionSecret.key }} } }
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-api }
spec:
  selector: { app.kubernetes.io/name: agent-forge-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-web }
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: agent-forge-web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: agent-forge-web } }
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, runAsNonRoot: true }
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true }
      volumes:
        - name: nginx-config
          configMap: { name: {{ .Release.Name }}-web }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-web }
spec:
  selector: { app.kubernetes.io/name: agent-forge-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- if .Values.crewaiWorker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-crewai-worker }
spec:
  replicas: {{ .Values.crewaiWorker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: agent-forge-crewai-worker, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: agent-forge-crewai-worker, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      containers:
        - name: worker
          image: {{ .Values.crewaiWorker.image | quote }}
          args: ["run", "--concurrency", {{ .Values.crewaiWorker.concurrency | quote }}]
          resources: {{ toYaml .Values.resources.crewaiWorker | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: home, mountPath: /home/agentforge }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          secret: { secretName: {{ .Values.crewaiWorker.configSecretName }} }
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ .Release.Name }} }
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ .Release.Name }}-web, port: { name: http } }
{{- end }}
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: {{ .Release.Name }} }
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
  to: { kind: Service, name: {{ .Release.Name }}-web }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
{{- end }}
