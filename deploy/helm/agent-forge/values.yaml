web:
  image: agent-forge-web:0.1.0
  replicas: 1
api:
  image: agent-forge-api:0.1.0
  replicas: 1
  databaseUrlSecret:
    name: agent-forge-database
    key: url
  sessionSecret:
    name: agent-forge-session
    key: secret-key
crewaiWorker:
  enabled: false
  image: agent-forge-crewai-worker:0.6.0
  replicas: 1
  # Secret must contain config.json generated by `agent-forge-worker register`.
  configSecretName: agent-forge-crewai-worker
  concurrency: 1
route:
  enabled: false
  host: ""
ingress:
  enabled: true
  className: ""
  host: agent-forge.local
  tlsSecretName: ""
resources:
  web:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  api:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  crewaiWorker:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }
